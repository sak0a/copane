<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" fill="none">
  <rect fill="var(--vscode-sideBar-background, #f3f3f3)" stroke="var(--vscode-foreground, #3b3b3b)" stroke-opacity=".22" stroke-width="1.5" x="20" y="22" width="440" height="296" rx="12"/>
  <circle fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".22" cx="38" cy="38" r="4"/><circle fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".22" cx="52" cy="38" r="4"/><circle fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".22" cx="66" cy="38" r="4"/>
  <path stroke="var(--vscode-foreground, #3b3b3b)" stroke-opacity=".16" fill="none" d="M20 54h440"/>
  <!-- activity bar -->
  <path stroke="var(--vscode-foreground, #3b3b3b)" stroke-opacity=".16" fill="none" d="M56 54v264"/>
  <rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".22" x="30" y="68" width="16" height="13" rx="3"/><rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".22" x="30" y="94" width="16" height="13" rx="3"/>
  <g transform="translate(25 116) scale(0.21875)">
    <rect fill="none" stroke="#8b95a5" x="22" y="26" width="64" height="52" rx="10" stroke-width="6"/>
    <rect fill="#3794ff" x="42" y="50" width="64" height="52" rx="10"/>
    <path stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M56 68l10 8-10 8" stroke-width="6"/>
    <path stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M72 85h18" stroke-width="6"/>
