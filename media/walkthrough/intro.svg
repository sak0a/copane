  <rect fill="var(--vscode-terminal-ansiBlue, #3794ff)" x="238" y="75" width="70" height="18" rx="9"/>
  <text font-family="var(--vscode-font-family, -apple-system, Segoe UI, sans-serif)" fill="#ffffff" x="273.0" y="87.6" font-size="10.5" font-weight="600" text-anchor="middle">Claude 1</text>
  <rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".22" x="84" y="106" width="120" height="12" rx="3"/>
  <rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".10" x="84" y="126" width="210" height="7" rx="3"/><rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".10" x="84" y="139" width="180" height="7" rx="3"/>
  <rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".10" x="84" y="160" width="96" height="30" rx="6"/><rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".10" x="190" y="160" width="96" height="30" rx="6"/>
  <!-- the agent's pointer -->
  <path fill="var(--vscode-terminal-ansiBlue, #3794ff)" d="M232 170l0 22 6-6 5 10 4-2-5-10 8 0z" stroke="var(--vscode-editor-background, #fff)" stroke-width="1.5"/>
  <!-- terminal, owned by Claude 1 -->
  <rect fill="var(--vscode-editor-background, #ffffff)" stroke="var(--vscode-foreground, #3b3b3b)" stroke-opacity=".16" x="68" y="222" width="250" height="84" rx="7"/>
  <rect fill="var(--vscode-terminal-ansiBlue, #3794ff)" x="80" y="232" width="8" height="8" rx="2"/>
