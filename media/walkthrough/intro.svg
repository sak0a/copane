  <path stroke="var(--vscode-foreground, #3b3b3b)" stroke-opacity=".16" fill="none" d="M68 248h250"/>
  <text font-family="var(--vscode-editor-font-family, Menlo, Consolas, monospace)" fill="var(--vscode-foreground, #3b3b3b)" x="80" y="268" font-size="11">$ npm test</text>
  <text font-family="var(--vscode-editor-font-family, Menlo, Consolas, monospace)" x="80" y="288" font-size="11"><tspan fill="var(--vscode-terminal-ansiGreen, #23a35f)">✓</tspan><tspan fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".55"> 42 passed</tspan></text>
