  <rect fill="var(--vscode-terminal-ansiBlue, #3794ff)" x="364" y="122" width="58" height="6" rx="3"/><rect fill="var(--vscode-terminal-ansiBlue, #3794ff)" x="364" y="134" width="40" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".10" x="342" y="160" width="86" height="7" rx="3"/><rect fill="var(--vscode-foreground, #3b3b3b)" fill-opacity=".10" x="342" y="173" width="70" height="7" rx="3"/>
