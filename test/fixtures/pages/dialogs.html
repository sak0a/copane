<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialogs fixture</title></head>
<body>
<h1>Dialogs</h1>
<button id="alert" onclick="alert('Hello from alert'); document.getElementById('out').textContent = 'alert closed'">Alert</button>
<button id="confirm" onclick="document.getElementById('out').textContent = 'confirm: ' + confirm('Delete everything?')">Confirm</button>
<button id="prompt" onclick="document.getElementById('out').textContent = 'prompt: ' + prompt('Your name?', 'Anon')">Prompt</button>
<button id="later" onclick="setTimeout(() => alert('Delayed alert'), 300)">Alert later</button>
<label><input type="checkbox" id="guard" onchange="window.onbeforeunload = this.checked ? (e => { e.preventDefault(); e.returnValue = ''; return ''; }) : null"> Unsaved changes</label>
<p id="out" role="status"></p>
</body></html>
