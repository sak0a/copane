<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Frames fixture</title></head>
<body>
<h1>Frames and shadow DOM</h1>
<iframe id="same" title="Same origin frame" src="/frame.html" width="320" height="110"></iframe>
<iframe id="cross" title="Other origin frame" width="320" height="110"></iframe>
<div id="host"></div>
<div id="closed-host"></div>
<script>
  // The cross-origin frame comes from the second fixture server, passed as ?other=<origin>.
  const other = new URLSearchParams(location.search).get('other');
  if (other) document.getElementById('cross').src = other + '/frame.html';
  const open = document.getElementById('host').attachShadow({ mode: 'open' });
  open.innerHTML = '<p>Shadow text</p><button id="shadow-btn">Shadow button</button><div id="inner-host"></div><input placeholder="Shadow input">';
  open.getElementById('shadow-btn').onclick = e => (e.target.textContent = 'Shadow clicked');
  open.getElementById('inner-host').attachShadow({ mode: 'open' }).innerHTML = '<button onclick="this.textContent=\'Nested clicked\'">Nested shadow button</button>';
  document.getElementById('closed-host').attachShadow({ mode: 'closed' }).innerHTML = '<button onclick="this.textContent=\'Closed clicked\'">Closed shadow button</button>';
</script>
</body></html>
