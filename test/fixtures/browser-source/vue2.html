<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Vue 2 fixture</title><script src="/common.js"></script></head>
<body>
  <div id="root">
    <div id="legacy">
      <span id="hint">Legacy hint</span>
    </div>
  </div>
  <script>
    // What Vue 2 sets: el.__vue__ on each component's root element, vm.$parent, and $options.__file
    // (vue-loader in development, relative to the project).
    const root = { $options: {}, $parent: undefined };
    const app = { $options: { name: 'App', __file: 'src/App.vue' }, $parent: root };
    const panel = { $options: { name: 'LegacyPanel', __file: 'src/components/LegacyPanel.vue' }, $parent: app };
    document.getElementById('root').__vue__ = root;
    document.getElementById('legacy').__vue__ = panel;
  </script>
</body>
</html>
