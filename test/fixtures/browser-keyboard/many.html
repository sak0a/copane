<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Many links fixture</title>
<style>
  body { font: 14px sans-serif; margin: 16px; columns: 4; }
  a { display: block; }
</style>
</head>
<body>
<main id="list"></main>
<script>
  // 400 links: more Tab stops than one walk takes.
  const list = document.getElementById('list');
  for (let i = 1; i <= 400; i++) {
    const a = document.createElement('a');
    a.href = `#item-${i}`;
    a.textContent = `Item ${i}`;
    list.appendChild(a);
  }
</script>
</body>
</html>
