<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One-element trap fixture</title>
<style>body { font: 15px/1.4 sans-serif; margin: 16px; }</style>
</head>
<body>
<!-- Tab (and Shift+Tab) on "Trap" moves focus on, then its script takes it back a moment later,
     without preventDefault: focus seems to wrap to the only stop, but "After" is reachable. -->
<button type="button" id="trap">Trap</button>
<button type="button" id="after">After</button>
<script>
  const trap = document.getElementById('trap');
  trap.addEventListener('keydown', e => { if (e.key === 'Tab') setTimeout(() => trap.focus(), 0); });
</script>
</body>
</html>
