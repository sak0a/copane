<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Big trap fixture</title>
<style>
  body { font: 15px/1.4 sans-serif; margin: 16px; }
</style>
</head>
<body>
<button type="button">Before</button>
<nav id="trap" aria-label="Big menu"></nav>
<button type="button">After</button>
<script>
  // 100 links; Tab on the last goes back to the first, Shift+Tab on the first to the last.
  const nav = document.getElementById('trap');
  for (let i = 1; i <= 100; i++) {
    const a = document.createElement('a');
    a.href = '#l' + i;
    a.textContent = 'Menu entry number ' + i;
    a.style.display = 'block';
    nav.appendChild(a);
  }
  const links = [...nav.querySelectorAll('a')];
  links.at(-1).addEventListener('keydown', e => { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); links[0].focus(); } });
  links[0].addEventListener('keydown', e => { if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); links.at(-1).focus(); } });
</script>
</body>
</html>
